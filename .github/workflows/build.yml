name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build APK
      run: |
        unzip src.zip
        
        mkdir -p app/src/main/java/com/allhack/cheats
        if [ -d "src/com" ]; then
          cp -r src/com app/src/main/java/
        else
          cp -r com app/src/main/java/
        fi
        
        cp AndroidManifest.xml app/src/main/
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # GERA O WRAPPER PRIMEIRO (ANTES DO GRADLE FICAR DOIDO)
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        
        # AGORA CRIA OS ARQUIVOS DO PROJETO
        echo "buildscript {" > build.gradle
        echo "    repositories { google(); mavenCentral() }" >> build.gradle
        echo "    dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }" >> build.gradle
        echo "}" >> build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        
        echo "rootProject.name = 'FFcheat'" > settings.gradle
        echo "include ':app'" >> settings.gradle
        
        echo "plugins { id 'com.android.application' }" > app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace 'com.allhack.cheats'" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "    defaultConfig {" >> app/build.gradle
        echo "        applicationId 'com.allhack.cheats'" >> app/build.gradle
        echo "        minSdk 21" >> app/build.gradle
        echo "        targetSdk 34" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "}" >> app/build.gradle
        
        # COMPILA O APK
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FFcheat-APK
        path: app/build/outputs/apk/debug/app-debug.apk
