name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Build APK
      run: |
        unzip src.zip
        mkdir -p app/src/main/java/com/allhack/cheats
        cp -r src/com app/src/main/java/
        cp AndroidManifest.xml app/src/main/
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "android {" > app/build.gradle
        echo "    namespace 'com.allhack.cheats'" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "    defaultConfig {" >> app/build.gradle
        echo "        applicationId 'com.allhack.cheats'" >> app/build.gradle
        echo "        minSdk 21" >> app/build.gradle
        echo "        targetSdk 34" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "include ':app'" > settings.gradle
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FFcheat-APK
        path: app/build/outputs/apk/debug/app-debug.apk
