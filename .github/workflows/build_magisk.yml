name: Build Zygisk Module
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d
    - name: Build Zygisk
      run: |
        unzip jni.zip
        mkdir -p MagiskMod/zygisk MagiskMod/system/lib64
        
        cd jni
        ndk-build
        cd ..
        cp jni/libs/arm64-v8a/libffhook.so MagiskMod/system/lib64/
        
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -shared -fPIC -O2 zygisk.cpp -o MagiskMod/zygisk/arm64-v8a.so -llog -ldl
        
        echo "id=ffbypass" > MagiskMod/module.prop
        echo "name=FF Bypass" >> MagiskMod/module.prop
        echo "version=v1.0" >> MagiskMod/module.prop
        echo "versionCode=1" >> MagiskMod/module.prop
        echo "author=ollie" >> MagiskMod/module.prop
        echo "description=Free Fire Ghost Bypass" >> MagiskMod/module.prop
        echo "zygisk=1" >> MagiskMod/module.prop
        
        cd MagiskMod
        zip -r ../FFBypass-Magisk.zip *
    - name: Upload Module
      uses: actions/upload-artifact@v4
      with:
        name: FFBypass-Magisk
        path: FFBypass-Magisk.zip
